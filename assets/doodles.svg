<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff007f;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#7928ca;stop-opacity:0.6" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00dfd8;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#007cf0;stop-opacity:0.5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .stroke-shape { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .neon-pink { stroke: url(#grad1); filter: url(#glow); }
    .neon-blue { stroke: url(#grad2); filter: url(#glow); }
    .soft-fill { fill: rgba(255, 255, 255, 0.03); }
  </style>

  <!-- Abstract Geometry & Playful Elements -->
  <!-- Top Left Concentric Shapes -->
  <circle cx="120" cy="120" r="80" class="stroke-shape neon-pink" stroke-width="3" stroke-dasharray="12 12"/>
  <circle cx="120" cy="120" r="40" class="stroke-shape neon-blue" stroke-width="2"/>
  
  <!-- Playful Wavy Path -->
  <path d="M 50,300 Q 150,200 250,320 T 450,280 T 650,350" class="stroke-shape neon-blue" stroke-width="4"/>
  <path d="M 100,500 C 200,400 350,550 500,450 S 700,480 750,420" class="stroke-shape neon-pink" stroke-width="3"/>

  <!-- Starburst / Asterisks -->
  <g transform="translate(680, 140)">
    <line x1="-30" y1="0" x2="30" y2="0" class="stroke-shape neon-pink" stroke-width="4"/>
    <line x1="0" y1="-30" x2="0" y2="30" class="stroke-shape neon-pink" stroke-width="4"/>
    <line x1="-20" y1="-20" x2="20" y2="20" class="stroke-shape neon-pink" stroke-width="4"/>
    <line x1="-20" y1="20" x2="20" y2="-20" class="stroke-shape neon-pink" stroke-width="4"/>
  </g>

</svg>
